# Publish a versioned artifact for every merge that bumps VERSION.
#
# WHY THIS EXISTS. canopy has enforced a real semver for a long time — VERSION,
# plugin.json and both marketplace.json fields must agree, and `check-version` fails the
# PR when they don't. Then it published nothing: zero tags, zero releases, no wheel. The
# number was rigorously maintained and structurally unusable, because no artifact anywhere
# WAS canopy 0.2.395.
#
# So every consumer had to install from source, and each one invented its own idea of
# "current": the cloud box `uv tool install git+<url>` (branch tip, install-once), then
# re-pointed at a local marketplace clone; the laptop `uv tool install --reinstall
# ~/.claude/plugins/marketplaces/canopy`. Nothing could ask "what version should I be on?"
# because the question had no answerable form — which is why the CLI sat eight days stale
# on the box running four of five agents while `canopy_runner`, which DOES ship as a built
# wheel, auto-updated itself on a 30-minute timer beside it.
#
# This is the missing half. `canopy --version` (added alongside) answers what is
# installed; a published release answers what should be. Steps 2 and 3 — boxes installing
# `canopy==<wanted>` from here instead of from a git ref, and the control plane naming
# <wanted> — land in canopy-web and depend on this existing first.
#
# IDEMPOTENT BY TAG. Most merges do not bump VERSION (a docs PR, a revert), and re-running
# a workflow must not fail or double-publish. The tag is the record of what has shipped:
# if v<VERSION> already exists, this is a merge that didn't bump, and the job exits green
# having done nothing. That also makes the release safe to re-run by hand.
#
# release-agent-factory (sibling job below) publishes packages/canopy_agent_factory —
# the agent-scaffolding factory, extracted into its own zero-runtime-dependency
# distribution so canopy-web can consume it without inheriting canopy's Pillow/NumPy
# footprint (see EXTRACTION-BRIEF.md / EXTRACTION-REPORT.md). It VERSIONS INDEPENDENTLY
# of `canopy` — its own pyproject.toml `[project] version`, its own tag namespace
# (`agent-factory-v<version>`, never `v<version>` — that prefix is canopy's), its own
# idempotency check. It is deliberately NOT part of the VERSION/plugin.json/
# marketplace.json trio that `version-check.yml` enforces agree with each other.
#
# It publishes to PyPI (not a GitHub Release asset like `canopy` above) because a second
# consumer needs real version *resolution* via a normal `dependencies = [...]` entry —
# a Release asset means pinning an exact download URL, untenable against a repo that
# tags every release. Uses PyPI Trusted Publishing (OIDC): no long-lived token stored in
# this repo. That requires a human to have registered `dimagi-internal/canopy` +
# `release.yml` + this job as a "pending publisher" for the `canopy-agent-factory`
# project on pypi.org BEFORE the first run — this workflow cannot do that part of the
# setup itself. If it hasn't been done, the publish step fails with an OIDC/403 error;
# everything else in the job (build, clean-venv version verification, the tag) still
# ran and is safe to re-run once that's set up.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write        # create the tag and the release

concurrency:
  # Two merges landing together must not race to publish the same version.
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tags, so the already-released check is real

      - uses: astral-sh/setup-uv@v5

      - name: Resolve the version this commit declares
        id: v
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "already=1" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is already tagged — this merge did not bump. Nothing to publish."
          else
            echo "already=0" >> "$GITHUB_OUTPUT"
            echo "Publishing v$VERSION."
          fi

      - name: Build the wheel + sdist
        if: steps.v.outputs.already == '0'
        run: uv build

      # The artifact must not be able to lie about which code it carries. `check-version`
      # proves the repo's three metadata files agree; this proves the BUILT wheel agrees
      # with them too, from a clean venv with no repo on the path — the same conditions a
      # box installs under. Without it a mis-set pyproject version would publish a wheel
      # that reports one number and contains another, and every downstream "am I current?"
      # comparison would silently be against the wrong thing.
      - name: Verify the built wheel reports the declared version
        if: steps.v.outputs.already == '0'
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          WHEEL=$(ls dist/*.whl)
          echo "verifying $WHEEL"
          uv venv /tmp/verify
          VIRTUAL_ENV=/tmp/verify uv pip install --quiet "$WHEEL"
          # cd / so nothing resolves out of the checkout — the wheel must stand alone.
          GOT=$(cd / && /tmp/verify/bin/canopy --version)
          echo "wheel reports: $GOT"
          test "$GOT" = "canopy $VERSION"

      - name: Publish the release
        if: steps.v.outputs.already == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          WHEEL_NAME=$(basename "$(ls dist/*.whl)")
          URL="https://github.com/$REPO/releases/download/v$VERSION/$WHEEL_NAME"
          {
            echo "Automated release of canopy $VERSION from $SHA."
            echo
            echo 'Install this exact version:'
            echo
            echo '```'
            echo "uv tool install --force \"canopy @ $URL\""
            echo '```'
            echo
            echo 'This repo is public, so that URL needs no token or auth header.'
            echo '`canopy --version` reports what is installed.'
          } > /tmp/notes.md
          gh release create "v$VERSION" dist/* \
            --title "canopy $VERSION" \
            --notes-file /tmp/notes.md

  release-agent-factory:
    runs-on: ubuntu-latest
    # Own concurrency group (default below), so this never queues behind — or blocks —
    # canopy's own release job; the two distributions ship on independent clocks.
    concurrency:
      group: release-agent-factory
      cancel-in-progress: false
    permissions:
      contents: write     # create the agent-factory-v<version> tag
      id-token: write     # PyPI Trusted Publishing (OIDC) — no stored token
    defaults:
      run:
        working-directory: packages/canopy_agent_factory
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tags, so the already-released check is real

      - uses: astral-sh/setup-uv@v5

      - name: Resolve the version this commit declares
        id: v
        run: |
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          TAG="agent-factory-v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "already=1" >> "$GITHUB_OUTPUT"
            echo "$TAG is already tagged — this merge did not bump canopy-agent-factory. Nothing to publish."
          else
            echo "already=0" >> "$GITHUB_OUTPUT"
            echo "Publishing $TAG."
          fi

      - name: Build the wheel + sdist
        if: steps.v.outputs.already == '0'
        run: uv build

      # Same discipline as canopy's own release job above: the artifact must not be able
      # to lie about which code it carries, proven from a clean venv with no repo on the
      # path — the same conditions `pip install canopy-agent-factory` runs under.
      - name: Verify the built wheel reports the declared version
        if: steps.v.outputs.already == '0'
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          WHEEL=$(ls dist/*.whl)
          echo "verifying $WHEEL"
          uv venv /tmp/verify-agent-factory
          VIRTUAL_ENV=/tmp/verify-agent-factory uv pip install --quiet "$WHEEL"
          # cd / so nothing resolves out of the checkout — the wheel must stand alone.
          GOT=$(cd / && /tmp/verify-agent-factory/bin/python -c "import canopy_agent_factory; print(canopy_agent_factory.__version__)")
          echo "wheel reports: $GOT"
          test "$GOT" = "$VERSION"

      # OIDC — requires a human to have registered this repo + workflow + job as a
      # "pending publisher" for the `canopy-agent-factory` project on pypi.org first.
      # See the file-header comment above for what that setup is and why this workflow
      # cannot do it itself.
      - name: Publish to PyPI
        if: steps.v.outputs.already == '0'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/canopy_agent_factory/dist

      - name: Tag the release
        if: steps.v.outputs.already == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.v.outputs.tag }}"
          git tag "$TAG" "${{ github.sha }}"
          git push origin "$TAG"
