name: Hook Python compatibility

# Hooks run under whatever python3 is on the user's PATH — often Xcode CLT
# python3.9 on macOS, not the project venv. A 3.10+-only annotation in hook
# code (e.g. `str | None` PEP 604 union) compiles fine in CI under our
# pyproject-pinned python3.11 but silently no-ops on real user machines.
# Catch that class of regression here by py_compile-ing every hook under each
# supported user python.
#
# `plugins/canopy/agent-core/*.py` is in scope because that is where the FLEET
# engines live — `gating_guard.py` and `gdoc_gate.py` are exec'd by every
# agent's thin loader, so they run under the same unknown user python3 as anything
# in hooks/, and reach five repos instead of one. They were outside this gate
# until 2026-08-27.

# Runs on every push and PR (no path filter) because it is a REQUIRED check: a path-filtered
# required check never reports on unrelated PRs and blocks them. It takes seconds.
on: [push, pull_request]

jobs:
  compile:
    runs-on: ubuntu-24.04  # Ubuntu 26.04 has no Python 3.9, and macOS system Python 3.9 is what this guards
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: py_compile every hook
        run: |
          set -e
          shopt -s nullglob
          fail=0
          for f in hooks/*.py plugins/canopy/hooks/*.py plugins/canopy/agent-core/*.py; do
            echo "==> $f under python ${{ matrix.python-version }}"
            python -m py_compile "$f" || fail=1
          done
          if [ "$fail" = "1" ]; then
            echo "::error::One or more hooks fail to compile under python ${{ matrix.python-version }}"
            exit 1
          fi
      - name: run the guards under this python
        # py_compile misses runtime-only breakage (an unquoted `str | None` annotation without
        # `from __future__ import annotations` fails at import, not compile). A guard that
        # crashes is now a block for every tool call, so prove each one runs: allow a plain
        # command, block a raw send in an agent session.
        run: |
          set -e
          export CANOPY_PLUGIN_DIR="$PWD/plugins/canopy"
          agent="$RUNNER_TEMP/agent"; mkdir -p "$agent/config"
          echo '{"slug": "zed", "channels": ["email"], "deny": [], "approve": []}' > "$agent/config/gating.json"
          ok='{"tool_name": "Bash", "tool_input": {"command": "git status"}, "cwd": "'"$agent"'"}'
          send='{"tool_name": "Bash", "tool_input": {"command": "gog gmail send --to a@b.c --subject s --body b"}, "cwd": "'"$agent"'"}'
          G=plugins/canopy/agent-core/gating_guard.py
          echo "$ok" | python "$G" --session
          set +e; echo "$send" | python "$G" --session; rc=$?; set -e
          [ "$rc" = 2 ] || { echo "::error::gating_guard did not block a raw send under python ${{ matrix.python-version }} (exit $rc)"; exit 1; }
          for h in profile_guard one_shot_turn_guard; do
            echo "$ok" | python "plugins/canopy/hooks/$h.py"
          done
          echo "$ok" | python plugins/canopy/hooks/credential_guard.py --pre

  # The one context branch protection requires, whatever the matrix becomes.
  hook-compat:
    needs: compile
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.compile.result }}" = success ]'
