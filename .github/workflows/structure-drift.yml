# Structural self-audit — canopy's documented structure vs the actual tree.
#
# `canopy structure-drift` can be gated because its default invocation resolves a
# real checkout (and fails loudly when it can't); run against the uv tool dir it
# would report a fabricated `version_sync` error and silently scan nothing.
#
# Why its OWN job rather than a step in `python-tests.yml`: branch protection on `main`
# requires status *contexts* by name. A step appended to the `pytest` job would ride
# under the `pytest` context, and a structural regression would share that context
# instead of having its own. A "warning nobody's build fails on" is how an over-cap
# description sits unnoticed; a *check* nobody's merge fails on is the same hole one
# level up. A standalone job gives this an addressable context name (`structure-drift`)
# that is in the required set.
#
# `--strict` exits non-zero on ANY finding, warnings included (cli.py: `if strict
# and not report["ok"]`). That's deliberate. The one warning-severity invariant is
# `skill_description_budget`, and Claude Code silently truncates over-cap descriptions, so treating it as
# build-breaking matches CLAUDE.md's layered-prevention doctrine.
#
# No `--repo` flag needed: in CI the checkout is both the source tree and the
# CWD, so `default_repo_root()` resolves on its first rung.
name: Structure drift

on: [push, pull_request]

jobs:
  structure-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Structural self-audit
        run: uv run canopy structure-drift --strict
