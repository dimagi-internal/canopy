# Python test suite — without it a PR can land an untiered module and
# silently break main's `test_plugin_boundary`. check-version
# and docs-sync validate metadata; nothing validated the code until the gws
# node workflow arrived, and that only covers plugins/canopy/test/gws.
#
# tests/walkthrough is included: it does not need "playwright + a display". No test
# in that directory calls sync_playwright() or .launch() — they only need the
# playwright package to be IMPORTABLE, and the whole directory runs in under a
# second with no browser binaries present. Excluding it would leave the tests
# covering record_video.py and the recorder orchestrator running nowhere: not in
# CI, and not locally either unless someone remembered `uv sync --extra browser`,
# so a syntax error in record_video.py would survive a full local `pytest tests/`.
name: Python tests
on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run pytest (full suite; playwright package only, no browsers)
        run: |
          uv sync --extra browser
          uv run pytest -q -p no:cacheprovider

      # canopy_agent_factory (packages/canopy_agent_factory) is a standalone,
      # zero-runtime-dependency distribution — the agent-scaffolding factory,
      # published separately so canopy-web can consume it without inheriting
      # canopy's Pillow/NumPy footprint. Its pyproject.toml has its own
      # testpaths, so `uv run pytest` at repo root (above) never collects it;
      # it needs its own step, run in its own directory with no orchestrator
      # on the path, exactly as this package's own suite proves it stands alone.
      - name: Run canopy_agent_factory tests
        working-directory: packages/canopy_agent_factory
        run: uv run --with pytest pytest -q
