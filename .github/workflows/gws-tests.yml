name: gws-mcp tests

# Drift gates + unit tests for the canopy-gws MCP server (the TypeScript
# Google Workspace server under plugins/canopy/mcp/). Fully offline: the
# suite exercises exported handlers with mocked Google clients and parses
# the server source statically — no Google auth, no network.
#
# Installs are DETERMINISTIC: plugins/canopy/package-lock.json is committed and
# this job uses `npm ci`, which installs exactly that tree and fails loudly if it
# has drifted from package.json. It used to run a bare `npm install` with nothing
# pinned — re-resolving from the live registry on every run — which reddened every
# open branch at once when npm's resolver choked (canopy#594) and could equally
# have gone green on a tree nobody had tested.

on:
  push:
    paths:
      - 'plugins/canopy/mcp/**'
      - 'plugins/canopy/test/**'
      - 'plugins/canopy/scripts/**'
      - 'plugins/canopy/package.json'
      - 'plugins/canopy/tsconfig.json'
      - 'plugins/canopy/vitest.config.ts'
      - 'plugins/canopy/.claude-plugin/plugin.json'
      - '.github/workflows/gws-tests.yml'
  pull_request:
    paths:
      - 'plugins/canopy/mcp/**'
      - 'plugins/canopy/test/**'
      - 'plugins/canopy/scripts/**'
      - 'plugins/canopy/package.json'
      - 'plugins/canopy/tsconfig.json'
      - 'plugins/canopy/vitest.config.ts'
      - 'plugins/canopy/.claude-plugin/plugin.json'
      - '.github/workflows/gws-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/canopy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit
      - name: Run vitest suite
        run: npx vitest run
