[project]
name = "canopy"
version = "0.2.462"
description = "Self-improving MCP orchestration with autoresearch"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "click>=8.0",
    "pydantic>=2.13.4",
    # Pillow: downscale per-scene screenshots into inline JPEG data-URIs for the
    # product_findings review (scripts/ddd/findings_review.py thumbnail helper).
    "pillow>=10.0",
    # numpy: duplicate_frames compares rendered PNGs pixel-wise, and it is a
    # GATE, not a test helper. It used to sit in the dev extra on the reasoning
    # that "the lens degrades to a pass without it rather than crashing" — which
    # is precisely the failure: the default invocation has no dev extra, so the
    # gate reported pass while comparing zero pairs. A check that only runs for
    # people who happen to have installed the test extra is not a check.
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
browser = [
    "playwright>=1.40",
]

[project.scripts]
canopy = "orchestrator.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Ship non-.py runtime data in the wheel. Without this, setuptools packages the
# code but drops these files, so the INSTALLED CLI crashes while `uv run` from a
# source checkout still works (the files sit next to the code there). That split
# is what made `canopy analyze`/`improve` fail only when invoked as the installed
# tool. Keep in sync with any new package-relative data reads.
[tool.setuptools.package-data]
orchestrator = ["static/*.html", "TIERS.md"]
"orchestrator.prompts" = ["*.md"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
markers = [
    "slow: tests that take >1s; skip with -m 'not slow'",
    "integration: end-to-end flow tests touching multiple subsystems",
]

