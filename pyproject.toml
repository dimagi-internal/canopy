[project]
name = "canopy"
version = "0.2.523"
description = "Self-improving MCP orchestration with autoresearch"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "click>=8.0",
    "pydantic>=2.13.4",
    # Pillow: downscale per-scene screenshots into inline JPEG data-URIs for the
    # product_findings review (scripts/ddd/findings_review.py thumbnail helper).
    "pillow>=10.0",
    # numpy: duplicate_frames compares rendered PNGs pixel-wise, and it is a
    # GATE, not a test helper. It used to sit in the dev extra on the reasoning
    # that "the lens degrades to a pass without it rather than crashing" — which
    # is precisely the failure: the default invocation has no dev extra, so the
    # gate reported pass while comparing zero pairs. A check that only runs for
    # people who happen to have installed the test extra is not a check.
    "numpy>=1.26",
    # The agent-scaffolding factory (`canopy create-agent`) — stdlib-only, versioned and
    # published on its OWN clock. Lives in-repo at packages/canopy_agent_factory; resolved
    # as an editable path dep via [tool.uv.sources] below so this checkout always builds
    # against its own working copy. A second consumer (canopy-web) installs the same
    # package from PyPI, which is the whole reason it's a separate distribution: canopy's
    # runtime deps (Pillow, NumPy, for the DDD screenshot/video gates) must never leak into
    # a Django web image that only needs to render text templates.
    "canopy-agent-factory>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
browser = [
    "playwright>=1.40",
]

[project.scripts]
canopy = "orchestrator.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Ship non-.py runtime data in the wheel. Without this, setuptools packages the
# code but drops these files, so the INSTALLED CLI crashes while `uv run` from a
# source checkout still works (the files sit next to the code there). That split
# is what made `canopy analyze`/`improve` fail only when invoked as the installed
# tool. Keep in sync with any new package-relative data reads.
[tool.setuptools.package-data]
orchestrator = ["static/*.html", "TIERS.md"]
"orchestrator.prompts" = ["*.md"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]

[tool.uv.sources]
# The agent factory ships in-repo as a standalone installable package; wire it as an
# editable path dep so `from canopy_agent_factory import ...` resolves under `uv run`
# without publishing to an index. canopy-web installs the same package from PyPI.
canopy-agent-factory = { path = "packages/canopy_agent_factory", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
markers = [
    "slow: tests that take >1s; skip with -m 'not slow'",
    "integration: end-to-end flow tests touching multiple subsystems",
]

