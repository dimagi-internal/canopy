- label: "install-runner.ps1"
  pages: [docs/onboarding-a-new-operator.md]
  file: runner/canopy_runner/scripts/install-runner.ps1
  needles: ["-NoTasks", '$TASK_FOLDER  = "\Canopy"', '$UPDATER_TASK = "canopy-runner-updater"']
- label: "canopy-runner update-check"
  pages: [docs/onboarding-a-new-operator.md]
  file: runner/canopy_runner/canopy_runner/main.py
  needles: ['"update-check"']
- label: "--remote-debugging-port=9222"
  pages: [docs/onboarding-a-new-operator.md]
  file: runner/canopy_runner/README.md
  needles: ["--remote-debugging-port=9222", "emdash4.db", "Emdash CDP"]
