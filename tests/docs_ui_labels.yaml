  needles: ["label: 'Overview'", "routing: 'overview'"]
- label: "Members"
  pages: [docs/onboarding-a-new-operator.md]
  file: frontend/src/pages/WorkspaceSettingsPage.tsx
  needles: ["label: 'Members'"]
- label: "Add a runner"
  pages: [docs/onboarding-a-new-operator.md]
  file: frontend/src/pages/topology/panels/AddRunnerPanel.tsx
  needles: ["Add a runner"]
- label: "Refresh runner"
