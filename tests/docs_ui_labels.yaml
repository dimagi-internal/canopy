# Every canopy-web screen label or runner-install detail an end-user page names, with the
# canopy-web file that defines it. tests/test_docs_ui_labels.py checks (always) that each
# label is still named in its pages, and (when CANOPY_WEB_PATH points at a canopy-web
# checkout) that the file still contains every needle. Add an entry when a page starts
# naming a button, tab or installer detail; drop it when the page stops.
- label: "Give it its canopy login"
  pages: [docs/setting-up-an-agent-from-claude.md, docs/onboarding-a-new-operator.md]
  file: frontend/src/pages/agents/AgentCanopyLogin.tsx
  needles: ["Give it its canopy login"]
- label: "Connect Google"
  pages: [docs/setting-up-an-agent-from-claude.md, docs/onboarding-a-new-operator.md]
  file: frontend/src/pages/agents/AgentAccountsPanel.tsx
  needles: ["Connect Google"]
- label: "Give them access"
  pages: [docs/setting-up-an-agent-from-claude.md, docs/onboarding-a-new-operator.md, docs/running-an-agent.md]
  file: frontend/src/pages/agents/AgentZkSection.tsx
  needles: ["Give ${pending.length === 1 ? 'them'", "access`"]
- label: "Grant pending"
  pages: [docs/setting-up-an-agent-from-claude.md, docs/onboarding-a-new-operator.md, docs/running-an-agent.md]
  file: frontend/src/components/agents/AgentHowItRuns.tsx
  needles: ["Grant pending"]
- label: "External accounts"
  pages: [docs/setting-up-an-agent-from-claude.md]
