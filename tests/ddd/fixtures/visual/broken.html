<!doctype html><html><head><style>
  /* A deliberately PURGED bundle: h-28 and text-rose-700 are NOT defined,
     exactly as labs' Tailwind build leaves them when a utility is used only
     inside render_code. */
  body { font-family: sans-serif; color: rgb(37,37,37); background: #fff; margin: 0; padding: 16px; }
  .chart { display: flex; gap: 4px; align-items: flex-end; }
  .bar { width: 18px; background: #6366f1; }
  .label { font-size: 13px; color: rgb(165,165,165); }
  .font-medium { font-weight: 500; }
  .space-y-1 > :not(:last-child) { margin-bottom: 4px; }
  .list-disc { list-style-type: disc; }
  .mx-auto { margin-left: auto; margin-right: auto; }
  .js-toggle {}
  [x-cloak] { display: none; }
</style></head><body>
  <div class="chart">
    <div class="bar h-28"></div><div class="bar h-28"></div><div class="bar h-28"></div>
  </div>
  <div class="label"><span>Segment A · 41%</span></div>
  <p><span class="text-rose-700 font-medium">consent 89.7% · below the 90% floor</span></p>
  <div class="space-y-1"><span>one</span></div>
  <ul class="list-disc"><li>a note</li></ul>
  <div class="mx-auto">centred</div>
  <div class="modal h-28" style="display:none">hidden modal</div>
</body></html>
