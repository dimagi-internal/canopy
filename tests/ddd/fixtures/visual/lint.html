<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: sans-serif; width: 1600px; }
  .bar { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: #eee; }
  .pill { position: fixed; left: 300px; top: 500px; width: 180px; height: 44px; background: #4b2; }
  .footer-note { position: absolute; left: 250px; top: 505px; width: 400px; height: 24px; margin: 0; }
  .tile { position: absolute; left: 40px; top: 200px; width: 90px; margin: 0;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wide { position: absolute; left: 1200px; top: 300px; width: 300px; margin: 0; }
</style>
</head>
<body>
  <div class="bar"><span class="bar-label">Programme report</span></div>
  <p class="footer-note">Data refreshed nightly from Connect</p>
  <p class="tile">AT PAYMENT FLOOR</p>
  <p class="wide">Attention column</p>
  <button class="pill"><span class="pill-label">Ask an agent</span></button>
</body>
</html>
