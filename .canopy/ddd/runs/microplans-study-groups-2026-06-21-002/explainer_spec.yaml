    outro: ''
  script: 'Design a controlled two-arm study, right from the map

    Maya starts a brand-new two-arm study on her Kaura programme.

    In the plan editor she turns on the campaign''s service-delivery data.

    The visits blanket Attakar — everywhere Connect logged delivery. She''ll sample
    by ward.

    She tags Attakar as the intervention arm and runs Compare. Every neighbouring
    ward is ranked against it — but look at what the table shows. Match is how similar
    the two wards look overall. The column that matters is Matched balance: if Maya
    picks this ward as her control and lets the engine match-sample it, how balanced
    the two arms actually come out — the very number her study''s comparability check
    will report. And Common support is how much of the settlement-density range the
    two wards share, because matching only draws from that shared range. So a ward
    that''s only a partial overall match can still deliver a perfectly balanced study.

    Sopp and Gura are the best-balanced controls, both at 0.02. Zankan was the programme''s
    own ward last cycle, so it''s out. Of the two, Gura shares more common support
    with Attakar — so Maya makes it the control arm.

    She sets the sampling methodology and clicks Generate — both arms'' sample drawn
    in one pass, balanced by design.

    She advances the plan to Approved. Each area keeps its arm labs-side, but the
    Connect export carries no arm column — so surveyors stay blind. The study''s ready
    for a survey firm.'
