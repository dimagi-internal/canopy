  script: 'Run a national vaccination campaign from one command center

    Amara opens her campaign and the whole thing is already in front of her — funding drawn down, enrolment and attendance climbing, verification and payment status broken out — so she starts the morning
    reading where the campaign actually stands instead of assembling it.

    Amara moves to payments to release this week''s pay, and the tool stops her on a worker it won''t let her approve — his identity check came back rejected — so the bad payment never leaves.

    And it isn''t a handful of workers - the same roster holds the whole nation, five thousand across every one of Nigeria''s 37 states, and Amara pages straight through it without a stutter.

    Amara opens the worker''s KYC to see why, and there it is — a duplicate national-ID flag tying him to another record — so she holds him instead of paying.

    Before she releases more funds Amara drops into the microplans and reads the planned workforce and budget against what''s actually been spent and deployed.

    Amara opens the worker profiles and confirms what she''s been acting on all morning is a real CommCare case on a real ward — name, role, NIN, location — not a mock.

    Amara opens System Administration and reads the audit log — every payment hold and verification decision she just made, written down against the actor''s name.

    Amara ends the morning on the reporting board - per-state coverage shaded by reach across all 37 states - and exports the week''s numbers as a CSV she can hand straight to the donor.

    Amara ends the morning on the coverage map - all 37 of Nigeria''s states shaded by how far the campaign has reached, every worker''s location dropped on top - reading at a glance where the country still
    needs her.'
