  by_beat:
    title: Crossopp Redefine Measure From Chat
    s1: Maya opens the infant growth curve for her KMC workspace and sees the lightest
      babies' line sit flat across the weeks — not the catch-up climb she expects
      — and she doesn't trust the chart.
    s2: Maya opens the lineage for the age_days measure and reads, opportunity by
      opportunity, that it is resolved to a raw child-age field with a plain CAST
      — a field she recognizes does not track real age.
    s3: From the lineage card Maya clicks Edit definition and tells Scout, in plain
      language, that age_days should be the number of days between the visit date
      and the child's date of birth — not the child_age field — and Scout starts re-deriving
      the measure as a formula.
    s4: Scout shows Maya the redefined age_days for each opportunity — the days between
      visit date and date of birth — including the opportunity whose date-of-birth
      column is named differently, and asks her to confirm before committing.
    s5: The moment Maya approves, the cube reloads — a definition change, not a data
      rebuild — and the same growth curve redraws itself, the lightest band now climbing
      in proper catch-up growth toward the 2,500g milestone.
    s6: Maya re-opens the age_days lineage and reads the corrected definition — days
      between visit date and date of birth — confirming, in the same surface where
      she found the bug, that she fixed the metric herself.
    outro: ''
  script: 'Crossopp Redefine Measure From Chat

    Maya opens the infant growth curve for her KMC workspace and sees the lightest
    babies'' line sit flat across the weeks — not the catch-up climb she expects —
    and she doesn''t trust the chart.

    Maya opens the lineage for the age_days measure and reads, opportunity by opportunity,
    that it is resolved to a raw child-age field with a plain CAST — a field she recognizes
    does not track real age.

    From the lineage card Maya clicks Edit definition and tells Scout, in plain language,
    that age_days should be the number of days between the visit date and the child''s
    date of birth — not the child_age field — and Scout starts re-deriving the measure
    as a formula.

    Scout shows Maya the redefined age_days for each opportunity — the days between
    visit date and date of birth — including the opportunity whose date-of-birth column
    is named differently, and asks her to confirm before committing.

    The moment Maya approves, the cube reloads — a definition change, not a data rebuild
    — and the same growth curve redraws itself, the lightest band now climbing in
    proper catch-up growth toward the 2,500g milestone.

    Maya re-opens the age_days lineage and reads the corrected definition — days between
    visit date and date of birth — confirming, in the same surface where she found
    the bug, that she fixed the metric herself.'
