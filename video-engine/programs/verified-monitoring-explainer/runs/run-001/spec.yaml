  script: 'A demo of continuous independent monitoring on Connect

    David''s program looks good on paper — his workers log every vitamin-A visit,
    and the coverage number is high. But a logged visit isn''t proof a household was
    reached, or that outcomes changed. So he commissioned an independent survey —
    and he wants to see the verification machinery itself: the trend round over round,
    each surveyor''s quality, and a back-check he can read row by row. Not ''trust
    us'' — proof he can drill into.

    David opens the independent survey''s six-round trend. It confirms a real rise
    in vitamin-A coverage — but below what his programme reports.

    On the map, delivery points fill only the intervention ward; the survey checked
    both. So the gap is real, not a coverage artifact.

    He checks the surveyors, one row each. One — T6 — is flagged: its quality scores
    trip the review threshold.

    He opens T6''s back-check: an independent enumerator re-visited the households,
    and the answers don''t match.

    And the Distributions screen — T6''s interviews ran impossibly fast and too uniform:
    statistical fingerprints of fabrication.'
